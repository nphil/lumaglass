      <stop offset="100%" stop-color="#26233a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#splashBg)"/>
  
  <!-- Centered icon at larger size -->
  <g transform="translate(790, 370)">
